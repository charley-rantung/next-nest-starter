packages:
  - "apps/*"
  - "packages/*"

catalog:
  zod: ^4.5.4
  jose: ^6.2.10
  dayjs: ^1.11.23

linkWorkspacePackages: true

overrides:
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.5"

allowBuilds:
  '@parcel/watcher': true
  "@prisma/engines": true
  "@swc/core": true
  bcrypt: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.102.7"
  - "@tanstack/query-devtools@5.102.7"
  - "@tanstack/react-query-devtools@5.102.7"
  - "@tanstack/react-query@5.102.7"
  - "@ant-design/icons-svg@4.6.0"
  - "@ant-design/icons@6.3.4"
  - "@next/env@16.3.4"
  - "@next/eslint-plugin-next@16.3.4"
  - "@next/swc-darwin-arm64@16.3.4"
  - "@next/swc-darwin-x64@16.3.4"
  - "@next/swc-linux-arm64-gnu@16.3.4"
  - "@next/swc-linux-arm64-musl@16.3.4"
  - "@next/swc-linux-x64-gnu@16.3.4"
  - "@next/swc-linux-x64-musl@16.3.4"
  - "@next/swc-win32-arm64-msvc@16.3.4"
  - "@next/swc-win32-x64-msvc@16.3.4"
  - eslint-config-next@16.3.4
  - next@16.3.4
